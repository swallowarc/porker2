name: Release

# main マージ時に on-merge-main.yml が検証して push した :<短い SHA> のイメージを、リリース版として昇格させる。
# 再ビルドはしない。起動の仕方が 2 つあり、どちらも同じ手順を通る:
#   - workflow_dispatch: 最新の vX.Y.Z の patch を +1 した版を決め、git タグも打つ
#   - vX.Y.Z タグの push: そのタグ名を版として使う (minor / major を上げたいときはこちら)
# GITHUB_TOKEN によるタグ push は他の workflow を起動しないので、dispatch が打つタグでこの workflow が二重に走ることはない。
# push イベントはタグが指すコミット時点の workflow 定義で動く。この定義より前のコミットにタグを打つと
# ここは起動せず、当時の定義 (素からビルドする docker-build.yml など) が動くので、古いコミットのリリースには使わない

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# dispatch は同時に走ると同じ次版を計算しうるので直列にする。タグ push は版がタグで決まっているので
# タグごとに別グループにし、待機中の run が後続に cancel されないようにする
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}

permissions:
  actions: read
  checks: read
  contents: write

env:
  DOCKER_IMAGE: swallowarc/porker2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 下の merge-base で main との祖先関係を見るため、shallow にしない
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # 昇格できるのは main に乗っていて on-merge-main.yml を通ったコミットだけ。
      # タグ push では GITHUB_SHA がタグの指すコミットになるので、dispatch と同じ判定で済む
      - name: Verify the commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main. Only commits merged into main can be released."
            exit 1
          fi

      # 同じコミットの On Merge Main が走っていれば完了を待ち、失敗していれば止める。
      # run が見つからないケース (古いコミットなど) は次のイメージ存在確認で検出する
      - name: Wait for On Merge Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNS=$(gh run list \
            --workflow=on-merge-main.yml \
            --commit="$GITHUB_SHA" \
            --event=push \
            --json databaseId,status,conclusion)
          RUN_ID=$(echo "$RUNS" | jq -r '[.[] | select(.status != "completed")] | .[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            echo "Waiting for On Merge Main (run $RUN_ID) to complete..."
            gh run watch "$RUN_ID" --exit-status --interval 30
          else
            CONCLUSION=$(echo "$RUNS" | jq -r '.[0].conclusion // "none"')
            if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "none" ]; then
              echo "::error::On Merge Main for ${GITHUB_SHA} finished with '${CONCLUSION}'. Fix main before releasing."
              exit 1
            fi
          fi

      # :X.Y と :X の浮動タグは無条件に付け替えるので、版は既存の最大版より進んでいなければならない。
      # タグ push では push 済みのタグ自身が ls-remote に含まれるため、「最大版 == 自分」で判定する
      - name: Determine release version
        id: tag
        run: |
          LATEST=$(git ls-remote --tags origin 'v*' \
            | awk -F'refs/tags/' '{print $2}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NEXT="$GITHUB_REF_NAME"
            if [ "$LATEST" != "$NEXT" ]; then
              echo "::error::${NEXT} is older than the latest release ${LATEST}. Floating tags :X.Y and :X would move backwards, so releases must be monotonic."
              exit 1
            fi
            echo "Release version (from tag): ${NEXT}"
          else
            if [ -z "$LATEST" ]; then
              NEXT="v1.0.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            echo "Release version: ${LATEST:-none} -> ${NEXT}"
          fi
          VERSION="${NEXT#v}"
          {
            echo "name=${NEXT}"
            echo "version=${VERSION}"
            echo "minor=${VERSION%.*}"
            echo "major=${VERSION%%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # imagetools の 404 だと原因が読めないので、昇格元が無い理由を書いて止める
      - name: Verify the tested image exists
        env:
          SHA_TAG: ${{ steps.sha.outputs.short }}
        run: |
          if ! docker buildx imagetools inspect "${DOCKER_IMAGE}:${SHA_TAG}" > /dev/null; then
            echo "::error::${DOCKER_IMAGE}:${SHA_TAG} is not in the registry. On Merge Main pushes it only after E2E passes on a push to main."
            exit 1
          fi

      - name: Tag container images
        env:
          SHA_TAG: ${{ steps.sha.outputs.short }}
        run: |
          # docker pull/tag/push だとマニフェストが runner のアーキ単体に潰れるため、
          # imagetools create でマルチアーキのマニフェストリストごと再タグする
          docker buildx imagetools create \
            --tag "${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.version }}" \
            --tag "${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.minor }}" \
            --tag "${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.major }}" \
            "${{ env.DOCKER_IMAGE }}:${SHA_TAG}"

      # タグ push で起動したときはタグが既にあるので dispatch のときだけ打つ
      - name: Create and push git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Docker Image

            - `${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.version }}`
            - `${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.minor }}`
            - `${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.major }}`
