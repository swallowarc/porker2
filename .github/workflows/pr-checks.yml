name: PR Checks

on:
  pull_request:
  workflow_call:
    inputs:
      e2e:
        description: 'E2E (Playwright) をソース直起動で実行するか。main マージ時は本番イメージに対して別途実行するので false にする'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # internal/infrastructure/redis の結合テスト (Lua スクリプト) 用
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # flutter analyze は analysis_options.yaml の plugins (riverpod_lint) を読まないため、
      # dart analyze でプラグインのルールも検査する
      - name: Analyze (riverpod_lint)
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

  e2e:
    name: E2E (Playwright)
    # pull_request では常に実行。workflow_call では呼び出し側の e2e 入力に従う
    if: github.event_name == 'pull_request' || inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      # Playwright の webServer が go run するので、初回ビルドが起動待ちの timeout に食い込まないよう先に温める
      - name: Warm up Go build cache
        working-directory: backend
        run: go build ./...

      - name: Build web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define-from-file=env_local.json

      - name: Install Playwright
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: frontend/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
