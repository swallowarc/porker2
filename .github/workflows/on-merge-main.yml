name: On Merge Main

on:
  push:
    branches: [main]
  # ブランチから手動で流すと、push 以外 (ビルド → 起動 → E2E) を同じ手順で試せる
  workflow_dispatch:

env:
  DOCKER_IMAGE: swallowarc/porker2
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pr-checks.yml
    with:
      # E2E はソース直起動ではなく、下の docker-build で本番イメージに対して実行する
      e2e: false

  # 本番イメージを 1 回だけビルドして OCI tar に出し、その中の amd64 を起動して E2E を通し、
  # 合格したら同じ tar を skopeo でそのまま registry に転送する。push されるのは検証した成果物そのもので、
  # digest も一致する。ステップは失敗した時点で止まるので、E2E に落ちたイメージが registry に乗ることはない。
  docker-build:
    runs-on: ubuntu-latest
    needs: [checks]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      IMAGE_TAR: /tmp/porker2.tar
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # サードパーティの npm パッケージ (E2E の依存) は Docker Hub の認証情報がランナーに置かれる前に導入する
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install Playwright
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 認証付きで pull する (匿名 pull のレート制限を避ける)。E2E の実行前にログアウトする
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 唯一のビルド。registry には push せず、multi-arch の OCI tar に出力する
      - name: Build image (amd64 + arm64, to OCI archive)
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ env.IMAGE_TAR }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache

      # 以降 (イメージの起動と E2E) はサードパーティのコードを動かすので、push 権限を持つ認証情報を先に消す
      - name: Log out of Docker Hub
        run: docker logout

      # tar の中からランナーのアーキテクチャ (amd64) のイメージを取り出して Docker daemon に載せる。
      # skopeo の docker-daemon: 転送は古い API バージョンで接続して新しい daemon に拒否されることがあるため、
      # docker-archive 経由で docker load する
      - name: Load amd64 image from the archive
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${IMAGE_TAR}" "docker-archive:/tmp/candidate.tar:${DOCKER_IMAGE}:candidate"
          docker load -i /tmp/candidate.tar

      # services の Redis はランナーの localhost:6379 に公開されているので、host network で起動して届かせる。
      # frontend は BACKEND_URI なしでビルドされているため RPC は同一オリジン (nginx 8082 → grpc_pass) に飛ぶ。
      # 起動待ちは nginx の /health (無条件に 200 を返す) ではなく、E2E と同じ経路で Go サーバーまで届く RPC で判定する。
      # 空の Login は InvalidArgument (HTTP 400) を返し、副作用がない。Go サーバーが未起動なら nginx が 502 を返す
      - name: Run candidate image
        run: |
          docker run -d --name candidate --network host \
            -e ENV=local \
            -e REDIS_HOST_PORT=localhost:6379 \
            -e REDIS_DB=0 \
            -e CONNECT_CORS_ALLOW_ORIGINS=http://localhost:8082 \
            -e SESSION_COOKIE_DOMAIN=localhost \
            -e SESSION_COOKIE_SECURE=false \
            ${{ env.DOCKER_IMAGE }}:candidate
          # run は bash -e で動く。listen 前は curl が接続失敗 (exit 7) で終わるので、代入ごと中断されないよう || true を付ける
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://localhost:8082/porker.v2.Porker2Service/Login \
              -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$status" = "400" ]; then
              echo "candidate is ready (nginx -> backend responded)"
              exit 0
            fi
            echo "waiting for candidate (status=$status)"
            sleep 1
          done
          echo "candidate did not become ready"
          docker logs candidate
          exit 1

      - name: E2E against candidate image
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8082
        run: npx playwright test

      - name: Candidate logs
        if: failure()
        run: docker logs candidate

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-image
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7

      # E2E に合格したので push する。ログインはここで改めて行う (skopeo は ~/.docker/config.json を読む)。
      # 以降の push 系ステップは main への push のときだけ動く (workflow_dispatch では検証のみ)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 検証した tar をそのまま転送する (再ビルドしない)。latest は registry 内のコピーで、blob の転送は起きない
      - name: Push the tested image
        if: github.event_name == 'push'
        run: |
          skopeo copy --multi-arch all \
            "oci-archive:${IMAGE_TAR}" "docker://${DOCKER_IMAGE}:${{ steps.sha.outputs.short }}"
          skopeo copy --multi-arch all \
            "docker://${DOCKER_IMAGE}:${{ steps.sha.outputs.short }}" "docker://${DOCKER_IMAGE}:latest"
          skopeo inspect --raw "docker://${DOCKER_IMAGE}:latest" | head -c 2000; echo

      # ビルドキャッシュの書き出しも合格後に行う。同一ジョブのビルダーに残っている層を出すだけで、通常は再ビルドされない。
      # イメージは既に push 済みなので、ここが失敗しても (キャッシュが更新されないだけで) ジョブは赤にしない
      - name: Export build cache
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        continue-on-error: true
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
